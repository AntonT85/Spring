server:
  port: 8081

spring:
  h2:
    console:
      enabled: true

  jpa:
    generate-ddl: false
    #generate-ddl: true
    hibernate:
      ddl-auto: none
      #ddl-auto: create-drop
    show-sql: true

  #postgres
  #  datasource:
  #    url: jdbc:postgresql://localhost:5432/edupb
  #    username: admin
  #    password: admin
  #    driverClassName: org.postgresql.Driver
  #    initialization-mode: always

  datasource:
    url: jdbc:h2:mem:testdb

  liquibase:
    enabled: true
    change-log: classpath:db.changelog/rootChangeLog.xml

  kafka:
    bootstrap-servers: localhost:9092

  cloud:
    stream:
      bindings:
        demoInput:
          destination: demo
          group: demo-group
          consumer:
            contentType: text/plain
      kafka:
        binder:
          brokers: localhost:9092

logging:
  level:
    ru.diasoft.example: debug